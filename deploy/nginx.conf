# =====================================================================
#  Dzair Volley — nginx server block (self-hosting on a VPS)
#  Copy into /etc/nginx/conf.d/dzairvolley.conf, edit server_name, the
#  certificate paths and `root`, then:  nginx -t && systemctl reload nginx
# =====================================================================

# --- shared rate-limit zones (put in the http{} context) -------------
limit_req_zone $binary_remote_addr zone=dv_site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dv_assets:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=dv_conn:10m;

# --- block AI crawlers / bulk scrapers / headless browsers -------------
# (case-insensitive UA match). Googlebot, Bingbot and social-preview bots
# are intentionally NOT listed. Review before enabling: legitimate API
# clients that send a "python-requests" UA would be blocked too.
map $http_user_agent $dv_bad_bot {
    default 0;
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|Claude-SearchBot|Claude-User|anthropic-ai|Google-Extended|GoogleOther|Applebot-Extended|meta-externalagent|meta-externalfetcher|FacebookBot|Amazonbot|PerplexityBot|Perplexity-User|YouBot|CCBot|Bytespider|TikTokSpider|cohere-ai|Diffbot|ImagesiftBot|Omgilibot|omgili|Timpibot|VelenPublicWebCrawler|Webzio|Ai2Bot|SBIntuitionsBot|PanguBot|DuckAssistBot|MistralAI-User|img2dataset|AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|DataForSeoBot|MegaIndex|serpstatbot|Barkrowler|PetalBot|HTTrack|WebCopier|WebZIP|Teleport|SiteSucker|Offline Explorer|python-requests|python-urllib|scrapy|Go-http-client|aiohttp|libwww-perl|Java/|okhttp-scraper|HeadlessChrome|PhantomJS|Puppeteer|Playwright|Selenium)" 1;
    ""              1;   # empty User-Agent
}

server {
    listen 80;
    server_name dzairvolley.example www.dzairvolley.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dzairvolley.example www.dzairvolley.example;

    ssl_certificate     /etc/letsencrypt/live/dzairvolley.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dzairvolley.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/dzair-volley/dist;
    index index.html;
    server_tokens off;

    # robots.txt / security.txt must stay reachable by everyone
    location = /robots.txt              { allow all; try_files $uri =404; }
    location = /.well-known/security.txt { allow all; try_files $uri =404; }

    limit_conn dv_conn 30;
    client_max_body_size 1k;              # static site: nothing to upload here

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://ejvzspiztdzbgjkkearp.supabase.co wss://ejvzspiztdzbgjkkearp.supabase.co https://volleyball.highlightly.net https://volleyball-highlights-api.p.rapidapi.com https://api.mymemory.translated.net; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.dailymotion.com https://www.facebook.com https://web.facebook.com https://www.instagram.com https://www.tiktok.com https://drive.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noai, noimageai" always;

    location /assets/ {
        if ($dv_bad_bot) { return 403; }
        limit_req zone=dv_assets burst=80 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header lines are NOT inherited once a location sets its own,
        # so repeat the security ones here:
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        if ($dv_bad_bot) { return 403; }
        limit_req zone=dv_site burst=30 nodelay;
        try_files $uri /index.html;
    }

    # never serve dotfiles (except .well-known), source maps or env files
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(map|env|sh|sql|md)$ { deny all; }
}
